<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存储管理 · RK3399 NAS</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182538;background:#f3f5f8}body{margin:0}main{max-width:1000px;margin:40px auto;padding:20px}a{color:#2465c8}h1{margin:20px 0 8px}p,.muted{color:#607087}#disks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:24px 0}.card,#login,dialog{background:white;border:1px solid #dde4ed;border-radius:16px;padding:24px}.card h2{margin:0 0 8px}.info{font-size:14px;overflow-wrap:anywhere;line-height:1.8}progress{width:100%;height:14px;accent-color:#3275df;margin:12px 0}button,input{font:inherit;border:1px solid #ccd6e4;border-radius:8px;padding:10px 14px}button{background:#fff;color:#2465c8;cursor:pointer;margin:8px 6px 0 0}button:hover{background:#edf3ff}button:disabled{opacity:.5;cursor:default}.danger{color:#c23b38}.primary{background:#2465c8;color:#fff}input{max-width:100%;box-sizing:border-box}dialog{max-width:420px;width:calc(100% - 80px)}dialog::backdrop{background:#18253866}#message{white-space:pre-wrap;min-height:24px}#login form{display:flex;flex-wrap:wrap;gap:12px;align-items:center}#login button{margin:0}.actions{display:flex;flex-wrap:wrap}.offline{opacity:.7}.badge{display:inline-block;background:#edf3ff;padding:3px 9px;border-radius:20px;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #3275df;outline-offset:3px}</style></head><body><main>
<a href="/">← 返回首页</a><h1>存储管理</h1><p>查看外部 USB 存储，安全弹出或格式化。</p>
<section id="login"><form id="login-form"><label for="password">控制密码（账号 admin）</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">登录</button></form><p>使用 RK3399 控制台的远程控制密码，可能与文件管理密码不同。</p></section>
<div id="toolbar" hidden><button id="refresh">刷新磁盘</button><button id="logout">退出登录</button></div><p id="message" role="status" aria-live="polite"></p><div id="disks"></div>
<p class="muted">格式化采用系统 FAT 格式，清空所选 USB 卷全部文件，并保留 USB 编号。内置存储不提供弹出或格式化操作。</p>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-info"></p><p id="confirm-warning"></p><div id="confirm-input"><label for="disk-name">输入盘名确认</label><input id="disk-name" autocomplete="off"></div><button id="confirm-action" class="danger">确认</button><button id="cancel-action">取消</button></dialog>
</main><script>
let authorization='',busy=false,pending=null;
const el=id=>document.getElementById(id);
const states={mounted:'已挂载',mounted_ro:'已挂载',unmounted:'已连接 · 未挂载',unmountable:'无法挂载',disconnected:'已断开',checking:'检查中',ejecting:'正在卸载',formatting:'正在格式化'};
function size(n){if(n==null)return '—';const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(1)+' '+u[i]}
async function request(body){const r=await fetch('/api/storage',{method:body?'POST':'GET',cache:'no-store',headers:{Authorization:authorization,'X-Storage-Request':'1','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(r.status===401){authorization='';el('login').hidden=false;el('toolbar').hidden=true;el('disks').replaceChildren();throw Error('请输入正确的控制密码')}const j=await r.json();if(!j.ok)throw Error(j.error||'操作失败');return j}
function render(data){el('disks').replaceChildren();if(!data.disks.length){el('disks').textContent='未发现外部 USB 存储';return}for(const d of data.disks){const c=document.createElement('section');c.className='card'+(d.state==='disconnected'?' offline':'');c.innerHTML='<h2></h2><div class="badge"></div><p class="info"></p><progress max="1"></progress><p class="space"></p><div class="actions"></div>';c.querySelector('h2').textContent=d.name;c.querySelector('.badge').textContent=(states[d.state]||d.state)+(d.mounted?' · '+(d.readonly?'只读':'读写'):'');c.querySelector('.info').textContent=[d.vendor,d.model,d.label&&'卷标：'+d.label,d.filesystem&&'格式：'+d.filesystem,'UUID：'+d.uuid,d.serial&&'序列号：'+d.serial].filter(Boolean).join(' · ');const p=c.querySelector('progress');p.hidden=!d.mounted;p.value=d.totalBytes?1-d.availableBytes/d.totalBytes:0;c.querySelector('.space').textContent=d.mounted?'容量 '+size(d.totalBytes)+' · 已用 '+size(d.totalBytes-d.freeBytes)+' · 可用 '+size(d.availableBytes):d.sizeBytes?'容量 '+size(d.sizeBytes):'磁盘当前未连接';const actions=c.querySelector('.actions');if(d.mounted){const a=document.createElement('a');a.href='/files/'+encodeURIComponent(d.name)+'/';a.textContent='打开文件';a.style.margin='18px 12px 0 0';actions.append(a)}if(d.state!=='disconnected'){for(const [action,title] of [[d.mounted?'eject':'mount',d.mounted?'安全弹出':'挂载'],['format','格式化']]){const b=document.createElement('button');b.textContent=title;b.disabled=busy||data.busy||(action==='format'&&!d.canFormat);b.className=action==='format'?'danger':'';b.onclick=()=>confirm(d,action);actions.append(b)}}el('disks').append(c)}}
async function refresh(){if(!authorization||busy)return;try{render(await request())}catch(e){el('message').textContent=e.message}}
function confirm(d,action){pending={d,action};el('confirm-title').textContent=(action==='format'?'格式化 ':action==='eject'?'安全弹出 ':'挂载 ')+d.name;el('confirm-info').textContent=d.name+' · '+size(d.sizeBytes)+' · UUID：'+d.uuid;el('confirm-warning').textContent=action==='format'?'将清空此卷全部数据。格式：系统 FAT。此操作无法撤销。':action==='eject'?'停止该盘传输后继续，成功提示后再拔出。':'重新挂载该 USB 卷。';el('confirm-input').hidden=action!=='format';el('disk-name').value='';el('confirm-action').textContent=action==='format'?'清空并格式化':'确认';el('confirm-action').disabled=action==='format';el('confirm-dialog').showModal()}
el('disk-name').oninput=()=>el('confirm-action').disabled=pending?.action==='format'&&el('disk-name').value!==pending.d.name;
el('cancel-action').onclick=()=>{pending=null;el('confirm-dialog').close()};
el('confirm-action').onclick=async()=>{if(!pending||busy)return;const {d,action}=pending;const body={action,uuid:d.uuid,identity:d.identity,filesystem:'vfat',confirm:el('disk-name').value};el('confirm-dialog').close();pending=null;busy=true;el('message').textContent=action==='format'?'正在格式化，请勿拔盘或断电…':'正在处理，请稍候…';document.querySelectorAll('#disks button').forEach(b=>b.disabled=true);try{const data=await request(body);el('message').textContent=data.message;busy=false;render(data)}catch(e){el('message').textContent=e.message}finally{busy=false;await refresh()}};
el('login-form').onsubmit=async e=>{e.preventDefault();authorization='Basic '+btoa(unescape(encodeURIComponent('admin:'+el('password').value)));el('password').value='';try{const d=await request();el('login').hidden=true;el('toolbar').hidden=false;el('message').textContent='已连接';render(d)}catch(e){el('message').textContent=e.message}};
el('refresh').onclick=refresh;el('logout').onclick=()=>{authorization='';el('disks').replaceChildren();el('login').hidden=false;el('toolbar').hidden=true;el('message').textContent='已退出'};
setInterval(()=>{if(!pending)refresh()},5000);
</script></body></html>
