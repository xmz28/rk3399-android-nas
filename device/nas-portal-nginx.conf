user root;
worker_processes auto;
pid /run/nas-portal-nginx.pid;
error_log /var/log/nginx/nas-portal-error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/nas-extra/*.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    gzip off;
    client_max_body_size 0;
    server {
        listen 80;
        server_name a.local;
        location = / { root /opt/nas-portal; try_files /index.html =404; }
        location = /storage { return 308 /storage/; }
        location = /storage/ { root /opt/nas-portal; try_files /storage.html =404; }
        location = /api/storage {
            proxy_pass http://127.0.0.1:8765/api/v1/storage;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;
            proxy_hide_header WWW-Authenticate;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            proxy_read_timeout 270s;
        }
        location = /files { return 308 /files/; }
        location /files/ {
            proxy_pass http://127.0.0.1:3923;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /speedtest { return 308 /speedtest/; }
        location /speedtest/ {
            proxy_pass http://127.0.0.1:3002/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;
            proxy_set_header Accept-Encoding "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            sub_filter_once off;
            sub_filter '/assets/' '/speedtest/assets/';
            sub_filter '"/downloading"' '"/speedtest/downloading"';
            sub_filter '"/upload"' '"/speedtest/upload"';
        }
        location / { return 404; }
    }
}
