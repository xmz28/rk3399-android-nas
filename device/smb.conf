[global]
    workgroup = WORKGROUP
    server string = RK3399 NAS
    netbios name = RK3399-NAS
    security = user
    map to guest = never
    server min protocol = SMB2
    server max protocol = SMB3
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    log file = /var/log/samba/log.%m
    max log size = 100
    use sendfile = yes

[NAS]
    path = /mnt/nas
    browseable = yes
    read only = no
    guest ok = no
    valid users = admin
    force user = root
    create mask = 0664
    directory mask = 0775

[global]
    include = /etc/samba/usb-shares.conf
