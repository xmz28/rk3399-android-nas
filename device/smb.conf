[global]
    workgroup = WORKGROUP
    server string = RK3399 NAS
    security = user
    map to guest = never
    server min protocol = SMB2
    server max protocol = SMB3
    smb ports = 445
    disable netbios = yes
    load printers = no
    use sendfile = yes
    log file = /var/log/samba/log.%m
    max log size = 100

[NAS]
    path = /mnt/nas
    browseable = yes
    read only = no
    guest ok = no
    valid users = admin
    force user = root
    create mask = 0664
    directory mask = 0775
